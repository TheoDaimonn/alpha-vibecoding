services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build: .
    command: ["python", "-m", "src.run_api"]
    environment:
      DETECTOR: student
      STUDENT_MODEL_PATH: /app/artifacts/student-pii.pt
      CORRELATION_STORE: redis
      REDIS_URL: redis://redis:6379/0
      API_KEYS: "${API_KEYS:-}"
      WORKER_THREADS: "2"
      WORKER_BATCH_SIZE: "32"
      WORKER_BATCH_TIMEOUT_S: "0.02"
      API_WORKERS: "${API_WORKERS:-1}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"

  # Prints PUBLIC_URL and DOCS_URL after connecting, and after every reconnect.
  tunnel:
    build: ./deploy/tunnel
    environment:
      TUNNEL_TARGET: api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - tunnel-state:/state
    restart: unless-stopped

volumes:
  tunnel-state:
