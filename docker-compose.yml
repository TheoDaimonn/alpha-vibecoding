services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    profiles: ["rabbitmq"]

  api:
    build: .
    command: ["python", "-m", "src.run_api"]
    environment:
      MODEL_PATH: "${MODEL_PATH:-/app/ru_gliner_hybrid_v4/models/gliner-ru-pii-small}"
      DETECTOR: "${DETECTOR:-student}"
      STUDENT_MODEL_PATH: "${STUDENT_MODEL_PATH:-/app/artifacts/student-pii.pt}"
      RUBERT_MODEL_PATH: "${RUBERT_MODEL_PATH:-/app/artifacts/rubert-tiny2-fine-tuning}"
      CORRELATION_STORE: "${CORRELATION_STORE:-redis}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      MODEL_BATCH_SIZE: "${MODEL_BATCH_SIZE:-16}"
      RUBERT_MAX_LEN: "${RUBERT_MAX_LEN:-}"
      RUBERT_STRIDE: "${RUBERT_STRIDE:-}"
      ONNX_INTRA_THREADS: "${ONNX_INTRA_THREADS:-1}"
      ONNX_INTER_THREADS: "${ONNX_INTER_THREADS:-1}"
      DEVICE: "${DEVICE:-cpu}"
      THRESHOLD: "${THRESHOLD:-0.5}"
      POSTPROCESS: "${POSTPROCESS:-0}"
      REQUEST_TIMEOUT_S: "${REQUEST_TIMEOUT_S:-9}"
      RESULT_TTL_S: "${RESULT_TTL_S:-3600}"
      TRANSFORMER_MODEL_PATH: "${TRANSFORMER_MODEL_PATH:-/app/artifacts/transformer-pii.pt}"
      API_KEYS: "${API_KEYS:-}"
      TRANSPORT: inprocess
      WORKER_THREADS: "${WORKER_THREADS:-2}"
      WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE:-32}"
      WORKER_BATCH_TIMEOUT_S: "${WORKER_BATCH_TIMEOUT_S:-0.02}"
      API_WORKERS: "${API_WORKERS:-1}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"

  # Prints PUBLIC_URL and DOCS_URL after connecting, and after every reconnect.
  tunnel:
    build: ./deploy/tunnel
    environment:
      TUNNEL_TARGET: "${TUNNEL_TARGET:-api:8000}"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - tunnel-state:/state
    restart: unless-stopped

volumes:
  tunnel-state:
