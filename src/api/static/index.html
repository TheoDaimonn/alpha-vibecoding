<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PII Security Module — ручной тест</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f5f6fa; color: #222; }
  h1 { font-size: 24px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  textarea { width: 100%; min-height: 90px; font-size: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button { padding: 10px 18px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; }
  .btn-mask { background: #2563eb; color: #fff; }
  .btn-unmask { background: #059669; color: #fff; }
  .btn-copy { background: #e5e7eb; color: #222; }
  .result { margin-top: 12px; padding: 12px; background: #f0fdf4; border-radius: 8px; font-family: monospace; white-space: pre-wrap; word-break: break-word; }
  .result.err { background: #fef2f2; color: #b91c1c; }
  .meta { font-size: 13px; color: #666; margin-top: 8px; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .preset { background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .preset:hover { background: #e0e7ff; }
  label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
  .step { font-size: 13px; color: #888; margin-bottom: 4px; }
  .arrow { font-size: 22px; text-align: center; color: #999; margin: 8px 0; }
  .pid { font-family: monospace; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>🛡️ PII Security Module — ручной тест</h1>

  <div class="card">
    <div class="step">Шаг 1 — маскирование</div>
    <label>Исходный текст</label>
    <textarea id="input" placeholder="Введите текст с персональными данными...">Клиент Иванов Иван Иванович, email: ivanov@example.org, телефон +7 900 123-45-67, паспорт 4509 123456, ИНН 7707083893, карта 4276 1234 5678 9012</textarea>

    <div class="presets">
      <span class="preset" onclick="setPreset(this)">ФИО + email + телефон</span>
      <span class="preset" onclick="setPreset(this)">Паспорт + ИНН + карта</span>
      <span class="preset" onclick="setPreset(this)">Адрес + дата рождения</span>
      <span class="preset" onclick="setPreset(this)">Ловушка: поэт Пушкин</span>
      <span class="preset" onclick="setPreset(this)">Сложное предложение</span>
    </div>

    <div class="row">
      <button class="btn-mask" onclick="doMask()">🔒 Маскировать</button>
      <button class="btn-copy" onclick="copyToUnmask()">⬇️ В маску</button>
    </div>
  </div>

  <div class="arrow">▼</div>

  <div class="card">
    <div class="step">Шаг 2 — демаскирование</div>
    <label>Замаскированный текст</label>
    <textarea id="unmaskInput" placeholder="Сюда автоматически попадёт маска после маскирования..."></textarea>
    <div class="row">
      <button class="btn-unmask" onclick="doUnmask()">🔓 Демаскировать</button>
      <button class="btn-copy" onclick="copyResult()">📋 Копировать результат</button>
    </div>
    <div class="meta">payload_id: <span class="pid" id="pid">—</span></div>
  </div>

  <div class="card">
    <label>Результат</label>
    <div class="result" id="result">—</div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card">
    <label>Метрики сервиса</label>
    <div class="result" id="metrics">—</div>
  </div>

<script>
  let currentPid = null;

  const PRESETS = {
    "ФИО + email + телефон": "Клиент Иванов Иван Иванович, email: ivanov@example.org, телефон +7 900 123-45-67",
    "Паспорт + ИНН + карта": "Паспорт 4509 123456, ИНН 7707083893, карта 4276 1234 5678 9012, CVV 123, PIN 4321",
    "Адрес + дата рождения": "Адрес: г. Москва, ул. Тверская, д. 15, кв. 42, индекс 125009. Дата рождения: 12.05.1990",
    "Ловушка: поэт Пушкин": "Поэт Александр Пушкин родился в 1799 году. Адрес отделения Банка: г. Москва, ул. Ленина, 1",
    "Сложное предложение": "Согласно паспорту серия 4509 номер 123456, выданному ОВД г. Тулы 15.03.2015, гражданин РФ Сидоров Петр Петрович, 1985 г.р., проживает по адресу: 300000, г. Тула, ул. Мира, д. 7, кв. 3, тел. +7 (4872) 55-44-33"
  };

  function setPreset(el) {
    document.getElementById('input').value = PRESETS[el.textContent];
  }

  async function doMask() {
    const payload = document.getElementById('input').value;
    if (!payload.trim()) { alert('Введите текст'); return; }
    currentPid = 'manual-' + Date.now();
    await call('/process', { payload, payload_id: currentPid }, 'Маскирование');
  }

  async function doUnmask() {
    const payload = document.getElementById('unmaskInput').value;
    if (!payload.trim()) { alert('Вставьте маску в поле демаскирования'); return; }
    if (!currentPid) { alert('Сначала маскируйте'); return; }
    await call('/process', { payload, payload_id: currentPid }, 'Демаскирование');
  }

  function copyToUnmask() {
    const r = document.getElementById('result').textContent;
    if (r && r !== '—' && r !== '⏳ Обработка...') {
      document.getElementById('unmaskInput').value = r;
    } else {
      alert('Сначала маскируйте');
    }
  }

  async function call(url, body, label) {
    const res = document.getElementById('result');
    const meta = document.getElementById('meta');
    res.className = 'result';
    res.textContent = '⏳ Обработка...';
    meta.textContent = '';

    try {
      const t0 = performance.now();
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const dt = ((performance.now() - t0) / 1000).toFixed(3);
      const data = await resp.json();

      if (!resp.ok) {
        res.className = 'result err';
        res.textContent = `Ошибка ${resp.status}: ${JSON.stringify(data)}`;
        return;
      }

      res.textContent = data.result;
      meta.textContent = `${label} · ${dt}s · payload_id=${currentPid}`;
      document.getElementById('pid').textContent = currentPid;
      loadMetrics();
    } catch (e) {
      res.className = 'result err';
      res.textContent = 'Ошибка сети: ' + e.message;
    }
  }

  function copyResult() {
    const r = document.getElementById('result').textContent;
    if (r && r !== '—') navigator.clipboard.writeText(r);
  }

  async function loadMetrics() {
    try {
      const resp = await fetch('/metrics');
      const data = await resp.json();
      document.getElementById('metrics').textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      document.getElementById('metrics').textContent = '—';
    }
  }

  loadMetrics();
</script>
</body>
</html>
